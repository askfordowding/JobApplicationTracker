name: JobApplicationTracker CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: job-application-tracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mark-pending:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending status
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = @{
            state = 'pending'
            context = 'jobapplicationtracker/security-ci'
            description = 'Security verification is running.'
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -ContentType 'application/json' -Body $body

  verify:
    needs: mark-pending
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend tests
        working-directory: JobApplicationTracker
        run: |
          dotnet restore JobApplicationService.Tests/JobApplicationService.Tests.csproj
          dotnet restore JobApplicationService.IntegrationTests/JobApplicationService.IntegrationTests.csproj

      - name: Build backend
        working-directory: JobApplicationTracker
        run: dotnet build JobApplicationService.API/JobApplicationService.API.csproj --configuration Release

      - name: Run backend tests
        working-directory: JobApplicationTracker
        run: |
          dotnet test JobApplicationService.Tests/JobApplicationService.Tests.csproj --configuration Release
          dotnet test JobApplicationService.IntegrationTests/JobApplicationService.IntegrationTests.csproj --configuration Release

      - name: Check vulnerable NuGet packages
        working-directory: JobApplicationTracker
        run: |
          $output = dotnet list JobApplicationService.API/JobApplicationService.API.csproj package --vulnerable --include-transitive
          $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match 'has the following vulnerable packages') {
            throw 'Vulnerable NuGet packages were reported.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: JobApplicationTracker/jobapplicationtracker.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: JobApplicationTracker/jobapplicationtracker.client
        run: npm ci --no-fund

      - name: Audit frontend dependencies
        working-directory: JobApplicationTracker/jobapplicationtracker.client
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: JobApplicationTracker/jobapplicationtracker.client
        run: npm run build

  publish-result:
    if: always()
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Publish final status
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          $state = if ($env:VERIFY_RESULT -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Build, tests and dependency checks passed.' } else { 'Security verification failed.' }
          $body = @{
            state = $state
            context = 'jobapplicationtracker/security-ci'
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -ContentType 'application/json' -Body $body
