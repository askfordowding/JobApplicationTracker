name: Refresh client dependencies

on:
  push:
    branches:
      - feature/security-first-test-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/security-first-test-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: JobApplicationTracker/jobapplicationtracker.client/package-lock.json

      - name: Refresh vulnerable client dependencies
        working-directory: JobApplicationTracker/jobapplicationtracker.client
        run: |
          npm uninstall vue-template-compiler --save-dev
          npm install --save-dev vite@^8.2.2 @vitejs/plugin-vue@latest
          npm audit fix
          npm audit --audit-level=high
          npm run build

      - name: Commit refreshed dependency manifest and lockfile
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No dependency changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JobApplicationTracker/jobapplicationtracker.client/package.json JobApplicationTracker/jobapplicationtracker.client/package-lock.json
          git commit -m 'fix: refresh vulnerable client dependencies'
          git push origin HEAD:feature/security-first-test-hardening
